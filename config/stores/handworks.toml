# Store config for the Visibility agent.
# Only public facts go here: everything in this file may be sent to the AI provider.

[store]
name = "Handworks"
domain = "handworks.com.au"
city = "Melbourne"
country = "Australia"
areas = ["Prahran", "Brighton"]
categories = ["stationery", "greeting cards", "wrapping paper", "journals", "notebooks", "gifts"]
# Other spellings that count as our store when an answer names it.
aliases = ["Handworks Stationery", "Hand Works"]

# Spellings that should be counted as the same competitor.
[competitor_aliases]
"Milligram" = ["Milligram Studio", "Milligram Stationery"]
"kikki.K" = ["kikki K", "Kikki.K Melbourne"]

[questions]
# Two kinds of questions are asked every day:
#  - core: the same every day, so days can be compared. "fixed" uses the list below;
#    "generate" has the AI write target_count of them once (and again when this file changes).
#  - daily: daily_count new questions the AI writes each morning from this profile. Code rejects
#    any that name our store or repeat a question from the last novelty_days days.
# The 3 core questions come from the manual run of 14 Oct 2026 (one of them names an area).
mode = "fixed"
target_count = 3
list = [
  "Best stationery shops in Melbourne",
  "Where can I buy greeting cards and wrapping paper in Melbourne?",
  "Unique gift shops in Prahran or Brighton Melbourne",
]
daily_count = 6
novelty_days = 14

[run]
# AI Studio showed Gemini 3.8 Flash's free tier allows only about 20 requests per day
# (peak 23 on 24 Oct, bar full). 3 core x 2 tries + 6 daily x 1 try = 12 asks a day.
attempts_per_day = 2
daily_attempts = 1
timezone = "Australia/Melbourne"

[provider]
name = "gemini"
# Model that answers the buyer questions (stands in for the consumer app).
# gemini-2.5-* is closed to new API users (HTTP 404), so the 3.x models are used.
ask_model = "gemini-3.8-flash"
# Model that does the agent's own language work (question writing, extraction, summary).
# A separate model keeps it on a separate free-tier quota.
work_model = "gemini-3.5-flash-lite"
# false = plain model answer, no Google Search grounding. The report states which was used.
use_search = false
# Thinking effort for the buyer-question answers. "low" is closest to the Gemini app's fast mode
# and avoids paying for thinking tokens on a paid tier. "" = model default.
ask_thinking_level = "low"
# Free-tier answers took 2-4 minutes each in testing, so allow a long wait per call.
timeout_seconds = 300
# Free-tier limits are not published in a fixed place: check AI Studio (Dashboard -> Rate limits)
# for both models and keep these well under the requests-per-minute and per-day figures shown.
min_seconds_between_calls = 7.0
# Hard cap: 12 asks + 6 retries, still under Gemini 3.8 Flash's ~20/day. On 25 Oct Gemini answered
# "high demand" (HTTP 503) 5 times; each retry worked but the old cap of 14 cut the last 3 asks.
max_ask_calls_per_run = 18
max_work_calls_per_run = 40     # 12 extractions + up to 12 re-tries + 2 summary (3.5 Flash Lite has far more headroom)
max_retries = 4
# Waits 30s, 60s, 120s, 240s. Short waits used up the call budget in the first live run.
backoff_base_seconds = 30.0
