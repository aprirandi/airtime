name: Daily visibility run

on:
  schedule:
    - cron: "17 20 * * *"   # 20:17 UTC = early morning in Melbourne
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: airtime-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Check planned calls against budget
        run: python -m airtime plan --store handworks
      - name: Run Visibility agent
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m airtime seed --store handworks
          set +e
          python -m airtime run --store handworks
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit results (also on a failed run, so the failure is recorded)
        run: |
          git config user.name "airtime-bot"
          git config user.email "airtime-bot@users.noreply.github.com"
          git add data/airtime.sqlite docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily visibility run $(TZ=Australia/Melbourne date +%F)"
          git push
      - name: Fail loudly if the run failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "Visibility run failed with exit code ${{ steps.run.outputs.code }}; see the run step log."
          exit 1
