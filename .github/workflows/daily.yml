name: Daily Airtime shift

on:
  schedule:
    - cron: "17 20 * * *"   # 20:17 UTC = early morning in Melbourne
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: airtime-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # free-tier answers take minutes each
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Check planned calls against budget
        run: python -m airtime plan --store handworks
      - name: Run the shift - Asker, Analyst and Master checks (live progress every 7 minutes)
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "airtime-bot"
          git config user.email "airtime-bot@users.noreply.github.com"
          python -m airtime seed --store handworks
          # Publish docs/data/live.json while the agent works, so the dashboard shows the shift live.
          # 7 minutes keeps GitHub Pages under its ~10 deploys per hour.
          push_live() {
            git add docs/data/live.json
            git commit -q -m "Live: agent progress $(date -u +%H:%M) UTC" && git push -q || true
          }
          # First push after a minute ("on shift now"), then every 7 minutes.
          ( sleep 60; push_live; while sleep 420; do push_live; done ) &
          PUSHER=$!
          set +e
          python -m airtime run --store handworks
          code=$?
          kill "$PUSHER" 2>/dev/null
          wait "$PUSHER" 2>/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Commit results (also on a failed run, so the failure is recorded)
        run: |
          git add data/airtime.sqlite docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily visibility run $(TZ=Australia/Melbourne date +%F)"
          git push
      - name: Fail loudly if the run failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "Visibility run failed with exit code ${{ steps.run.outputs.code }}; see the run step log."
          exit 1
