name: Try a client page

# Walks the page-per-website service once, end to end, on the deployed site: creates a page for an address, opens it,
# makes a choice, re-checks it. It writes a real page to the database (use your own site), and it never prints the
# private link. Informational.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Address to make a page for (use your own website)"
        required: false
        default: "renosites.com.au"
      platform:
        description: "Platform to say (empty = let the service detect it)"
        required: false
        default: ""
      ask:
        description: "Also try the Asker (spends AI calls): yes or no"
        required: false
        default: "no"
      deployed:
        description: "Deployed address"
        required: false
        default: "https://airtime-ai.vercel.app"

  push:
    branches: [claude/zen-ptolemy-884w50]
    paths: [.github/workflows/try-page.yml]

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create, open, choose, re-check
        env:
          SITE: ${{ github.event.inputs.site || 'renosites.com.au' }}
          PLATFORM: ${{ github.event.inputs.platform || '' }}
          ASK: ${{ github.event.inputs.ask || 'no' }}
          DEPLOYED: ${{ github.event.inputs.deployed || 'https://airtime-ai.vercel.app' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          base = os.environ["DEPLOYED"].rstrip("/") + "/api/site"

          def call(body):
              req = urllib.request.Request(base, data=json.dumps(body).encode(), headers={"content-type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=70) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, json.load(e)

          status, made = call({"action": "create", "url": os.environ["SITE"], "platform": os.environ["PLATFORM"]})
          print("create:", status, made.get("error", "ok"), made.get("detail", ""))
          if status != 200:
              raise SystemExit(0)
          token = made["token"]  # never printed
          latest = made["latest"]
          print("  host:", made["site"]["host"], "| score:", latest["score"], "| fixes:", len(latest["fixes"]), "| guides:", len(made["guides"]))
          pk = made.get("packages")
          print("  packages:", "MISSING from the answer (old service?)" if pk is None else {k: ("ready" if v.get("ready") else v.get("reason")) for k, v in pk.items()})
          held = [f["check_id"] for f in latest["fixes"] if f["status"] == "platform_held"]
          print("  platform said:", repr(made["site"].get("platform")), "| used:", made["site"].get("platform_used"), "| audit platform:", repr(latest.get("platform")), "| held by platform:", len(held))
          print("  fix statuses:", "| fix statuses:", {f["check_id"]: f["status"] for f in latest["fixes"] if f["check_id"] in ("jsonld_organization", "organization_completeness", "llms_txt")})
          status, got = call({"action": "get", "token": token})
          print("get:", status, "| same score:", got.get("latest", {}).get("score") == latest["score"])
          first = latest["gaps"][0]
          status, chosen = call({"action": "fix", "token": token, "check_id": first, "state": "self"})
          print("fix:", status, "| saved:", chosen.get("states", {}).get(first))
          status, again = call({"action": "rescan", "token": token})
          print("rescan:", status, "| scans kept:", len(again.get("history", [])), "| baseline score:", (again.get("baseline") or {}).get("score"))
          # the Asker: only when the service has an assistant (the key is set); it spends seven calls of the AI key
          asker = again.get("asker", {})
          print("asker on:", asker.get("enabled"), "| trying it:", os.environ["ASK"])
          if asker.get("enabled") and os.environ["ASK"] == "yes":
              status, saved = call({"action": "profile", "token": token, "profile": {
                  "name": "Renosites", "city": "Melbourne", "categories": "website design, web development"}})
              print("profile:", status, saved.get("error", "ok"))
              status, start = call({"action": "ask_start", "token": token})
              print("ask start:", status, start.get("error", "ok"), "|", start.get("message", "") if status != 200 else "")
              if status == 200:
                  import time
                  total = start["total"]
                  for i in range(total):
                      t0 = time.time()
                      st, step = call({"action": "ask_step", "token": token, "run": start["run"], "i": i})
                      print(f"  question {i + 1}: {st} {step.get('error', 'ok')} in {time.time() - t0:.1f}s | answered: {step.get('answered')} | {step.get('detail', '')} | quota: {step.get('quota')}")
                  status, ran = call({"action": "ask_finish", "token": token, "run": start["run"]})
                  print("ask finish:", status, ran.get("error", "ok"), "|", ran.get("message", "") if status != 200 else "")
                  if status == 200:
                      latest = ran["asker"]["latest"]
                      print("  model:", latest["model"], "| asked:", latest["asked"], "| answered:", latest["answered"],
                            "| named:", latest["named"], "| other shops read:", latest["readOthers"],
                            "| rivals:", [r["name"] for r in latest["rivals"]][:5])
                      print("  first question:", latest["items"][0]["question"])
                      print("  first answer starts:", latest["items"][0]["answer"][:160].replace("\n", " "))
                      status, again2 = call({"action": "ask_start", "token": token})
                      print("ask again at once:", status, again2.get("error", "ok"))
          status, bad = call({"action": "get", "token": "x" * 32})
          print("wrong link:", status, bad.get("error"))
          PY
