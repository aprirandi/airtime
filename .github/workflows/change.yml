name: Record a change

# Version 0 has no write access to the store: the owner or a developer applies a fix, then records here the day it went
# live. That keeps the Asker's "before" for that day. Nothing is changed on the website by this workflow.
on:
  workflow_dispatch:
    inputs:
      store:
        description: "Store config (config/stores/<name>.toml)"
        required: false
        default: "handworks"
      check:
        description: "The check the fix was for, e.g. organization_completeness"
        required: true
      date:
        description: "The day it went live, YYYY-MM-DD"
        required: true
      note:
        description: "What was changed, in a few words"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: airtime-daily   # the database is committed by the daily shift and the audit too
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a run that waited in the queue starts from the latest main, not the one it was started on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record the change
        env:
          STORE: ${{ github.event.inputs.store }}
          CHECK: ${{ github.event.inputs.check }}
          DATE: ${{ github.event.inputs.date }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          STORE="${STORE:-handworks}"
          if [ "$STORE" = "handworks" ]; then python -m airtime seed --store handworks; fi
          python -m airtime change --store "$STORE" --check "$CHECK" --date "$DATE" --note "$NOTE"
      - name: Commit
        env:
          STORE: ${{ github.event.inputs.store }}
        run: |
          git config user.name "airtime-bot"
          git config user.email "airtime-bot@users.noreply.github.com"
          push_with_retry() {
            # main can move while a run is going (a merged change, a Pages rebuild): take it in and push again
            for attempt in 1 2 3 4; do
              if git push -q; then return 0; fi
              echo "push rejected (attempt $attempt): main moved during this run, rebasing onto it"
              git pull --rebase -q origin main || { git rebase --abort 2>/dev/null; echo "could not rebase onto main"; return 1; }
            done
            return 1
          }
          git add data/airtime.sqlite docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Record change $(TZ=Australia/Melbourne date +%F) (${STORE:-handworks})"
          push_with_retry
