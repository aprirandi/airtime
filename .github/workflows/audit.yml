name: Airtime website audit

# The Auditor scans the store's own website (robots.txt, sitemap, headings, structured data, agent files)
# and stores the result. No AI key is needed. Run it by hand for now; a schedule can be added once the
# scores have been checked against Is Agentic and Cloudflare's isitagentready on a real store.
on:
  workflow_dispatch:
    inputs:
      store:
        description: "Store config to audit (config/stores/<name>.toml)"
        required: false
        default: "handworks"

permissions:
  contents: write

concurrency:
  group: airtime-daily   # one at a time with the daily shift: both commit the database
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a run that waited in the queue starts from the latest main, not the one it was started on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Run the audit
        id: run
        env:
          STORE: ${{ github.event.inputs.store }}
        run: |
          set +e
          STORE="${STORE:-handworks}"
          if [ "$STORE" = "handworks" ]; then python -m airtime seed --store handworks; fi
          python -m airtime audit --store "$STORE"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit results (also on a failed run, so the failure is recorded)
        env:
          STORE: ${{ github.event.inputs.store }}
        run: |
          git config user.name "airtime-bot"
          git config user.email "airtime-bot@users.noreply.github.com"
          push_with_retry() {
            # main can move while a run is going (a merged change, a Pages rebuild): take it in and push again
            for attempt in 1 2 3 4; do
              if git push -q; then return 0; fi
              echo "push rejected (attempt $attempt): main moved during this run, rebasing onto it"
              git pull --rebase -q origin main || { git rebase --abort 2>/dev/null; echo "could not rebase onto main"; return 1; }
            done
            return 1
          }
          git add data/airtime.sqlite docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Website audit $(TZ=Australia/Melbourne date +%F)${STORE:+ ($STORE)}"
          push_with_retry
      - name: Fail loudly if the audit failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "Audit failed with exit code ${{ steps.run.outputs.code }}; see the audit step log."
          exit 1
