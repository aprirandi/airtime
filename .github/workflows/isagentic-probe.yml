name: Is Agentic probe

# One-off, read-only: print Is Agentic's terms and docs pages as plain text, so the terms of use can be read
# before the Auditor depends on the API. Nothing is committed.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/zen-ptolemy-884w50]
    paths: [.github/workflows/isagentic-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Terms and docs as text
        run: |
          for p in terms docs; do
            curl -sS -L -m 30 -H "User-Agent: airtime-probe" "https://is-agentic.com/$p" -o "$p.html" -w "$p http=%{http_code} bytes=%{size_download}\n"
            echo "=================== $p ==================="
            python3 - "$p.html" <<'PY'
          import html, re, sys
          s = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          s = re.sub(r"(?is)<(script|style|svg|noscript)[^>]*>.*?</\1>", " ", s)
          s = re.sub(r"(?i)</(p|div|li|h[1-6]|tr|section|article|br)>|<br\s*/?>", "\n", s)
          s = html.unescape(re.sub(r"<[^>]+>", " ", s))
          s = "\n".join(re.sub(r"[ \t]+", " ", l).strip() for l in s.splitlines())
          s = re.sub(r"\n{2,}", "\n", s).strip()
          print(s[:30000])
          PY
          done
