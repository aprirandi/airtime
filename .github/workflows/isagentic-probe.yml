name: Is Agentic probe

# One-off check of the real integration: runs the full audit (including the Is Agentic second opinion) against
# the live site with a throw-away database, and prints the result. Nothing is committed. To be deleted afterwards.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/zen-ptolemy-884w50]
    paths: [.github/workflows/isagentic-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Audit with the second opinion
        run: |
          python -m airtime --db /tmp/probe.sqlite seed --store handworks
          python -m airtime --db /tmp/probe.sqlite audit --store handworks
      - name: What was stored
        run: |
          python - <<'PY'
          import json, sqlite3
          c = sqlite3.connect("/tmp/probe.sqlite"); c.row_factory = sqlite3.Row
          r = c.execute("select * from external_reports").fetchone()
          print({k: (r[k] if k not in ("issues", "breakdown") else json.loads(r[k])) for k in r.keys() if k != "issues"})
          print("issues:", [(i["id"], i["kind"], i["maps_to"]) for i in json.loads(r["issues"])])
          a = json.load(open("docs/data/site.json"))["stores"][0]["audit"]
          print("ours", a["score"], "agreement", a["external"]["agreement"])
          PY
